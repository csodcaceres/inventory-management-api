[project]
name = "inventory-management-api"
version = "1.0.0"
description = "Production-ready Inventory Management REST API with FastAPI, SQLAlchemy, Alembic and clean architecture."
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy>=2.0.0",
    "pydantic-settings",
]


[tool.uv]
package = false

[dependency-groups]
dev = [
    "alembic>=1.18.5",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
